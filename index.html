<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deal Math</title>

  <!-- iPhone "Add to Home Screen" settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Deal Math">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f1b2d">

  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0f1b2d; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      text-align: center;
    }
    h1 { font-size: 44px; margin: 0 0 8px; }
    p  { font-size: 18px; color: #9fb3c8; margin: 4px 0; }
    .mode { margin-top: 24px; font-size: 14px; color: #3ddc97; }
  </style>
</head>
<body>
  <h1>Deal Math</h1>
  <p>Hello world. The pipeline works.</p>
  <p class="mode" id="mode"></p>

  <script>
    // Shows whether you opened it from the home screen icon (full screen) or in Safari
    var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    document.getElementById('mode').textContent = standalone
      ? 'Running full screen from your home screen ✓'
      : 'Running in the browser. Add to Home Screen to go full screen.';

    // Register the service worker (lets the app load fast and work offline)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
